# ---------------------------------------------------------------------------
# HESYD ONE — Reverse proxy de production (VPS)
# Monté par docker-compose.yml : ./nginx/hesyd.conf -> /etc/nginx/conf.d/default.conf:ro
#
# Certificats (placeholders attendus par ce fichier) :
#   /etc/nginx/certs/fullchain.pem  <- ./certs/fullchain.pem  sur l'hôte
#   /etc/nginx/certs/privkey.pem    <- ./certs/privkey.pem    sur l'hôte
#   Générés par certbot — procédure complète dans docs/DEPLOIEMENT.md.
#
# Rappels produit :
#   - dépôts de fichiers jusqu'à 25 Mo (contrôle applicatif réel) ;
#   - SSE de l'agent documentaire sous /api/agent/ (streaming des étapes) ;
#   - `http2 on;` nécessite nginx >= 1.25.1 (nginx:alpine actuel convient ;
#     sur une version plus ancienne, remplacer par `listen 443 ssl http2;`).
# ---------------------------------------------------------------------------

upstream hesyd_app {
    # Nom de service Compose « app », port interne 3000.
    server app:3000;
    keepalive 16;
}

# ————— HTTP : challenge ACME + redirection permanente vers HTTPS —————
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Remplacer par le domaine réel (ex. archives.exemple.fr).
    server_name _;

    # Renouvellements certbot en mode webroot : doit rester servie en HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ————— HTTPS —————
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    # Remplacer par le domaine réel.
    server_name _;

    # Placeholders de certificats (voir en-tête de fichier).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ————— En-têtes de sécurité —————
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ————— Compression —————
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/event-stream volontairement ABSENT : le SSE de l'agent ne doit
    # jamais être mis en tampon ni compressé (voir location /api/agent/).
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    # Dépôts de fichiers jusqu'à 25 Mo (contrôle applicatif) + marge : 30 Mo.
    client_max_body_size 30m;

    # ————— Agent documentaire : SSE (Server-Sent Events) —————
    # Le streaming des étapes de la mission exige : aucune mise en tampon,
    # délais longs (missions de plusieurs minutes, jusqu'à 6 étapes d'outils).
    location /api/agent/ {
        proxy_pass http://hesyd_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ————— Reste de l'application —————
    location / {
        proxy_pass http://hesyd_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
